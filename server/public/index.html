<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask your PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --ink: #1b1f2a;
    --muted: #5c6475;
    --line: #d5d9e0;
    --accent: #243b6b;
    --accent-ink: #ffffff;
    --hl: #ffe066;
    --err: #a3262a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181f;
      --surface: #1e222b;
      --ink: #eceef3;
      --muted: #9aa2b3;
      --line: #343a47;
      --accent: #9db4ff;
      --accent-ink: #12182b;
      --hl: #e6c93d;
      --err: #ff8a8d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    padding: 48px 20px 80px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  .lead { color: var(--muted); margin: 0 0 36px; max-width: 52ch; }
  form { display: grid; gap: 22px; }
  .field { display: grid; gap: 8px; }
  label, .label { font-weight: 500; font-size: 0.95rem; }
  input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  input[type="file"] {
    font: inherit;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 14px;
    width: 100%;
  }
  input[type="file"]::file-selector-button {
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    margin-right: 12px;
    cursor: pointer;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit;
    font-weight: 500;
    justify-self: start;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 6px;
    padding: 12px 22px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  #status { margin: 28px 0 0; color: var(--muted); min-height: 1.55em; }
  #status.error { color: var(--err); }
  #status.busy { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { #status.busy { animation: none; } }
  #result {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: inset 5px 0 0 var(--hl);
    border-radius: 6px;
    padding: 20px 22px 20px 28px;
  }
  #result h2 { margin: 0 0 8px; font-size: 0.95rem; font-weight: 500; color: var(--muted); }
  #answer {
    margin: 0;
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-size: 1.2rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main>
  <h1>Ask your PDF</h1>
  <p class="lead">Upload a PDF, type a question, and get an answer taken from the text of the file.</p>

  <form id="ask-form">
    <div class="field">
      <label for="pdf">PDF file</label>
      <input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf">
    </div>
    <div class="field">
      <label for="question">Your question</label>
      <input id="question" name="question" type="text" autocomplete="off" placeholder="e.g. Which topics does section 2 cover?">
    </div>
    <button id="submit" type="submit">Get answer</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden aria-live="polite">
    <h2>Answer</h2>
    <p id="answer"></p>
  </section>
</main>

<script>
  const form = document.getElementById("ask-form");
  const fileInput = document.getElementById("pdf");
  const questionInput = document.getElementById("question");
  const submitBtn = document.getElementById("submit");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const answerEl = document.getElementById("answer");

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    resultEl.hidden = true;

    const file = fileInput.files[0];
    const question = questionInput.value.trim();

    if (!file) { setStatus("Choose a PDF file first.", "error"); return; }
    if (!question) { setStatus("Type a question first.", "error"); return; }

    const data = new FormData();
    data.append("pdf", file);
    data.append("question", question);

    submitBtn.disabled = true;
    setStatus("Reading your PDF. On a free server the first request can take up to a minute.", "busy");

    try {
      const res = await fetch("/upload", { method: "POST", body: data });
      const body = await res.text();

      if (!res.ok) {
        let message = body;
        try { message = JSON.parse(body).error || body; } catch (_) {}
        throw new Error(message);
      }

      answerEl.textContent = body;
      resultEl.hidden = false;
      setStatus("");
    } catch (err) {
      setStatus("Could not get an answer: " + (err.message || "unknown error") + ". Check the server logs for details.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
